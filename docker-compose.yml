version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: land_records_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: land_records_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: land_records_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/land_records_db
      - JWT_SECRET_KEY=super-secret-land-record-jwt-token-key-change-in-production
      - LLM_PROVIDER=gemini
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      - db
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: land_records_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
